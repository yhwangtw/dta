name: Release

run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'UTC date tag to create (e.g. v2026.07.19 or v2026.07.19-1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[1-9][0-9]*)?$ ]]; then
            echo "Expected a UTC date tag such as v2026.07.19 or v2026.07.19-1, got: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}" node <<'NODE'
          const version = process.env.VERSION;
          const match = version.match(
            /^(\d{4})\.(\d{2})\.(\d{2})(?:-([1-9]\d*))?$/,
          );
          if (!match) throw new Error(`Invalid calendar version: ${version}`);
          const [, yearText, monthText, dayText] = match;
          const [year, month, day] = [yearText, monthText, dayText].map(Number);
          const date = new Date(Date.UTC(year, month - 1, day));
          if (
            date.getUTCFullYear() !== year ||
            date.getUTCMonth() !== month - 1 ||
            date.getUTCDate() !== day
          ) {
            throw new Error(`Invalid calendar version: ${version}`);
          }
          NODE

          # A previously-created historical tag may be resumed when its
          # GitHub Release is missing. A future tag is never valid, and every
          # brand-new workflow-dispatch tag must describe today's UTC date.
          BASE_TAG="${TAG%%-*}"
          TODAY="$(date -u +v%Y.%m.%d)"
          TAG_EXISTS=false
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=true
          fi
          if [[ "$BASE_TAG" > "$TODAY" ]]; then
            echo "Future release dates are not allowed (today: $TODAY), got: $TAG" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$BASE_TAG" != "$TODAY" ] && [ "$TAG_EXISTS" != true ]; then
            echo "New releases must use today's UTC date ($TODAY), got: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Version: ${TAG#v}"

      - name: Prepare release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_VERSION=$(git show "$TAG:package.json" | node -p \
              "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Tag $TAG exists but contains package version $TAG_VERSION" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
              echo "Tag $TAG is not reachable from main" >&2
              exit 1
            fi
            echo "Tag $TAG already exists with the expected version; resuming release creation."
            exit 0
          fi

          VERSION="$VERSION" node <<'NODE'
          const fs = require('node:fs');

          const version = process.env.VERSION;
          for (const file of ['package.json', 'package-lock.json']) {
            const contents = JSON.parse(fs.readFileSync(file, 'utf8'));
            contents.version = version;
            if (file === 'package-lock.json' && contents.packages?.['']) {
              contents.packages[''].version = version;
            }
            fs.writeFileSync(file, `${JSON.stringify(contents, null, 2)}\n`);
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: release $TAG [skip ci]"
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Generate categorized changelog
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|||%h" "$PREV_TAG".."$VERSION")
          else
            COMMITS=$(git log --pretty=format:"%s|||%h" -30)
          fi

          FEATS=""; FIXES=""; DOCS=""; REFACTORS=""; CHORES=""; OTHERS=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG="${line%%|||*}"
            HASH="${line##*|||}"
            DISPLAY_MSG="$MSG"

            case "$MSG" in
              feat*:*|feat*) FEATS="${FEATS}- ${DISPLAY_MSG#*: } (\`$HASH\`)\n" ;;
              fix*:*|fix*)   FIXES="${FIXES}- ${DISPLAY_MSG#*: } (\`$HASH\`)\n" ;;
              docs*:*|docs*) DOCS="${DOCS}- ${DISPLAY_MSG#*: } (\`$HASH\`)\n" ;;
              refactor*:*)   REFACTORS="${REFACTORS}- ${DISPLAY_MSG#*: } (\`$HASH\`)\n" ;;
              chore*:*|ci*:*) CHORES="${CHORES}- ${DISPLAY_MSG#*: } (\`$HASH\`)\n" ;;
              *)             OTHERS="${OTHERS}- ${DISPLAY_MSG} (\`$HASH\`)\n" ;;
            esac
          done <<< "$COMMITS"

          build_section() {
            local title="$1" content="$2"
            if [ -n "$content" ]; then
              echo "### $title"
              echo -e "$content"
            fi
          }

          {
            echo "## tGD-pi-web $VERSION"
            echo ""
            build_section "✨ Features" "$FEATS"
            build_section "🐛 Bug Fixes" "$FIXES"
            build_section "📝 Documentation" "$DOCS"
            build_section "♻️ Refactoring" "$REFACTORS"
            build_section "🔧 Chores" "$CHORES"
            build_section "📦 Other Changes" "$OTHERS"

            if [ -n "$PREV_TAG" ]; then
              echo "---"
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
            fi
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${{ steps.version.outputs.tag }}"
            exit 0
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --verify-tag \
            --title "tGD-pi-web ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            --latest
