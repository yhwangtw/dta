{{- if .Values.backupCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dta-agent-platform.fullname" . }}-backup
  labels:
    {{- include "dta-agent-platform.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backupCronJob.schedule | quote }}
  timeZone: {{ .Values.backupCronJob.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ printf "%s-backup" (include "dta-agent-platform.name" .) | trunc 63 | trimSuffix "-" }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: {{ required "backupCronJob.image is required" .Values.backupCronJob.image | quote }}
              imagePullPolicy: {{ .Values.backupCronJob.imagePullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              {{- with .Values.backupCronJob.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.backupCronJob.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.backupCronJob.envFrom }}
              envFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.backupCronJob.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml .Values.backupCronJob.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ default (printf "%s-data" (include "dta-agent-platform.fullname" .)) .Values.persistence.data.existingClaim }}
{{- end }}
