{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dta-agent-platform.fullname" . }}
  labels:
    {{- include "dta-agent-platform.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dta-agent-platform.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- if .Values.serviceMonitor.authorization.enabled }}
      authorization:
        type: Bearer
        credentials:
          name: {{ required "serviceMonitor.authorization.secretName is required" .Values.serviceMonitor.authorization.secretName }}
          key: {{ .Values.serviceMonitor.authorization.secretKey }}
      {{- end }}
{{- end }}
