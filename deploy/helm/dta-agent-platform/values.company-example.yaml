# Copy this file outside the repository and replace every example endpoint.
# Do not add secrets here; let Vault or External Secrets create the Secret.

image:
  # The published OCI chart is stamped with the matching verified Docker Hub
  # digest. Replace these placeholders only when deploying from a source checkout.
  repository: docker.io/yhwangtn/dta
  tag: "REPLACE_WITH_RELEASE_TAG"
  digest: ""

imagePullSecrets: []

ingress:
  enabled: true
  className: nginx
  annotations:
    # Replace with the annotations required by the company's Keycloak-aware
    # auth proxy. It must overwrite x-forwarded-access-token.
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
  hosts:
    - host: dta.company.example
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dta-company-tls
      hosts:
        - dta.company.example

persistence:
  data:
    storageClass: company-block-storage
    size: 50Gi

# Enable only after replacing the example selectors and CIDRs. Standard
# Kubernetes NetworkPolicy cannot match external DNS names.
networkPolicy:
  enabled: false
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
    allowDns: true
    extraRules:
      - to:
          - ipBlock:
              cidr: 10.0.0.0/8
        ports:
          - protocol: TCP
            port: 443

serviceMonitor:
  enabled: false
  labels:
    release: kube-prometheus-stack
  authorization:
    enabled: true
    secretName: dta-metrics-token
    secretKey: token

retentionCronJob:
  enabled: false
  tokenSecretName: dta-retention-token
  tokenSecretKey: token
  tokenHeader: x-forwarded-access-token

# Supply a company-approved digest-pinned backup image and Secret-backed
# destination settings before enabling this hook.
backupCronJob:
  enabled: false
  image: registry.company.example/platform/backup@sha256:REPLACE_WITH_DIGEST
  command: []
  args: []
  envFrom: []

secret:
  create: false
  existingSecret: dta-agent-platform-secrets

config:
  env:
    DTA_PUBLIC_BASE_URL: https://dta.company.example
    DTA_PROVIDER_ORGANIZATION: Digital Transformation Department
    DTA_PROVIDER_URL: https://dta.company.example

    DTA_AUTH_MODE: keycloak
    DTA_AUTH_TOKEN_HEADER: x-forwarded-access-token
    KEYCLOAK_ISSUER: https://sso.company.example/realms/company
    KEYCLOAK_AUDIENCE: dta-agent-platform
    KEYCLOAK_REQUIRED_ROLES: dta-user
    DTA_CODING_REQUIRED_ROLES: dta-coding-access
    DTA_REVIEW_REQUIRED_ROLES: dta-reviewer

    LLM_BASE_URL: https://llm-gateway.company.example/v1
    LLM_MODEL: company-model

    MINIO_ENDPOINT: https://minio.company.example
    MINIO_BUCKET: dta-artifacts

    N8N_BASE_URL: https://n8n.company.example
    DTA_ENABLE_WORKFLOW_TOOLS: "false"

    DTA_TRANSCRIPTION_BASE_URL: https://speech.company.example/v1
    DTA_TRANSCRIPTION_MODEL: company-transcription-model
    DTA_VISION_BASE_URL: https://vision.company.example/v1
    DTA_VISION_MODEL: company-vision-model

    DTA_UPLOAD_SCANNER_URL: https://scanner.company.example/scan
    DTA_AUDIT_SINK_URL: https://siem.company.example/ingest/dta
    DTA_STRUCTURED_LOGS: "true"

    # Start in report-only mode. Enable deletion only after Legal/Records
    # approves the periods and the first retention report is reviewed.
    DTA_RETENTION_ENABLED: "true"
    DTA_RETENTION_DRY_RUN: "true"
    DTA_ARTIFACT_RETENTION_DAYS: "365"
    DTA_RUN_RETENTION_DAYS: "365"
    DTA_MEDIA_JOB_RETENTION_DAYS: "30"
    DTA_WORKFLOW_RETENTION_DAYS: "365"
    DTA_RETENTION_PROTECT_APPROVED: "true"
    DTA_LEGAL_HOLD_RUN_IDS: ""

nodeSelector: {}
tolerations: []
affinity: {}
